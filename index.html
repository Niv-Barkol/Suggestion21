<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suggestion box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --desk: #cfdbe0;
    --ink: #26343c;
    --paper: #fff6b8;
    --rule: #a6c8da;
    --margin: #e69a9a;
    --pen: #2f5d7c;
    --hand: "Caveat", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100svh;
    background: var(--desk);
    color: var(--ink);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 28px 16px;
    font-family: var(--sans);
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  .stage { width: min(420px, 100%); }

  /* ---------- Note ---------- */
  /* The drop zone's bottom edge is the line of the slot: anything lower is clipped. */
  .dropzone {
    position: relative;
    z-index: 3;
    padding-bottom: 28px;
    clip-path: inset(-400px -400px 0 -400px);
  }
  .note {
    position: relative;
    background: var(--paper);
    padding: 24px 20px 16px 52px;
    transform: rotate(-1.2deg);
    box-shadow: 0 1px 1px rgba(0,0,0,.08), 0 10px 22px -8px rgba(40,50,60,.35);
    border-radius: 2px;
  }
  .note::before { /* margin line */
    content: ""; position: absolute; top: 0; bottom: 0; left: 38px; width: 2px;
    background: var(--margin); opacity: .8;
  }
  .note::after { /* tape */
    content: ""; position: absolute; top: -13px; left: 50%; width: 92px; height: 26px;
    margin-left: -46px; transform: rotate(2.5deg);
    background: rgba(255,255,255,.55);
    box-shadow: 0 1px 2px rgba(0,0,0,.12);
  }
  textarea {
    display: block; width: 100%; height: 216px; /* 6 lines */
    margin: 0; padding: 0; border: 0; outline: 0; resize: none;
    background-color: transparent;
    background-image: repeating-linear-gradient(transparent 0 35px, var(--rule) 35px 36px);
    background-attachment: local;
    font-family: var(--hand); font-weight: 500; font-size: 26px; line-height: 36px;
    color: var(--ink);
  }
  textarea::placeholder { color: rgba(38,52,60,.45); }
  .note-foot {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 10px; gap: 12px;
  }
  .count { font-size: 12px; color: rgba(38,52,60,.6); font-variant-numeric: tabular-nums; }
  button {
    font-family: var(--hand); font-weight: 700; font-size: 26px; line-height: 1;
    padding: 8px 26px 9px; border: 0; border-radius: 6px; cursor: pointer;
    background: var(--pen); color: #fff;
    box-shadow: 0 3px 0 #1d4157;
    transition: transform .08s, box-shadow .08s, filter .15s;
  }
  button:hover { filter: brightness(1.1); }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 #1d4157; }
  button:focus-visible, textarea:focus-visible { outline: 3px solid #1d4157; outline-offset: 3px; }
  button:disabled { cursor: default; filter: grayscale(.4) brightness(1.1); transform: none; box-shadow: 0 3px 0 #1d4157; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }

  /* ---------- Box ---------- */
  .box { position: relative; z-index: 1; margin-top: -28px; }
  .top {
    position: relative; height: 56px;
    background: linear-gradient(#dcb07c, #cf9f68);
    clip-path: polygon(7% 0, 93% 0, 100% 100%, 0 100%);
  }
  .slot {
    position: absolute; left: 20%; right: 20%; top: 50%; height: 14px;
    transform: translateY(-50%);
    background: #2b1d11; border-radius: 8px;
    box-shadow: inset 0 3px 5px rgba(0,0,0,.65);
  }
  .front {
    position: relative; height: 190px;
    background:
      repeating-linear-gradient(90deg, rgba(120,76,36,.07) 0 3px, transparent 3px 9px),
      linear-gradient(#c68f58, #b98450);
    border-top: 2px solid rgba(110,70,32,.45);
    border-radius: 0 0 6px 6px;
    box-shadow:
      inset 14px 0 18px -14px rgba(70,40,15,.45),
      inset -14px 0 18px -14px rgba(70,40,15,.45),
      0 22px 26px -14px rgba(30,40,50,.5);
    display: grid; place-items: center;
  }
  .label {
    background: #f6efe0; color: var(--ink);
    padding: 8px 26px 10px; transform: rotate(-1deg);
    font-family: var(--hand); font-weight: 700; font-size: 38px; line-height: 1;
    border-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,.25);
    text-align: center;
  }
  .strip { /* packing tape across the seam */
    position: absolute; left: 0; right: 0; top: -2px; height: 14px;
    background: rgba(238,222,176,.55);
  }

  .status {
    min-height: 2em; margin: 22px 0 0; text-align: center;
    font-family: var(--hand); font-weight: 700; font-size: 28px; line-height: 1.2;
  }
  .status.error { color: #8d2f2f; }

  @media (max-width: 380px) {
    .note { padding-left: 46px; }
    .note::before { left: 34px; }
    textarea { font-size: 24px; }
  }
</style>
</head>
<body>
  <main class="stage">
    <h1 class="sr-only">Suggestion box</h1>

    <form id="form" autocomplete="off">
      <div class="dropzone" id="dropzone">
        <div class="note" id="note">
          <label class="sr-only" for="text">Your suggestion</label>
          <textarea id="text" name="text" maxlength="1000" placeholder="Write your suggestion here…" required></textarea>
          <input class="hp" type="text" id="website" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
          <div class="note-foot">
            <span class="count" id="count" aria-hidden="true">0 / 1000</span>
            <button type="submit" id="send">Send</button>
          </div>
        </div>
      </div>
    </form>

    <div class="box" id="box" aria-hidden="true">
      <div class="top"><div class="slot"></div></div>
      <div class="front">
        <div class="strip"></div>
        <div class="label">Suggestion box</div>
      </div>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>

<script>
  // ▼▼▼ Your Google Form settings (see the setup instructions) ▼▼▼
  // Form URL: must end with /formResponse
  const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSdvFMTFjGKkxNnkIntjLSwdyUPeSAWG-_T9t7UcxmxIcFvnoA/formResponse";
  // Field ID of the question, e.g. "entry.1234567890"
  const ENTRY_ID = "entry.1732339710";
  // ▲▲▲ ---------------------------------------------------------- ▲▲▲

  const $ = (id) => document.getElementById(id);
  const form = $("form"), note = $("note"), dropzone = $("dropzone"), box = $("box");
  const ta = $("text"), btn = $("send"), statusEl = $("status"), count = $("count");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const REST = "rotate(-1.2deg)";

  ta.addEventListener("input", () => { count.textContent = ta.value.length + " / 1000"; });

  function setStatus(msg, isError) {
    statusEl.textContent = msg || "";
    statusEl.classList.toggle("error", !!isError);
  }

  function dropNote() {
    if (reduceMotion) {
      return note.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 250, fill: "forwards" }).finished;
    }
    const dist = note.offsetHeight + 48;
    setTimeout(() => {
      box.animate(
        [{ transform: "translateY(0)" },
         { transform: "translateY(6px) scale(1.012, .985)" },
         { transform: "translateY(0)" }],
        { duration: 380, easing: "ease-out" }
      );
    }, 900);
    return note.animate(
      [{ transform: REST, offset: 0 },
       { transform: "rotate(0deg) translateY(-16px) scale(.97, 1)", offset: .18 },
       { transform: "rotate(0deg) translateY(24px) scale(.62, .98)", offset: .42 },
       { transform: "rotate(0deg) translateY(" + dist + "px) scale(.62, .98)", offset: 1 }],
      { duration: 1100, easing: "ease-in", fill: "forwards" }
    ).finished;
  }

  async function bringNoteBack() {
    note.style.visibility = "hidden";
    note.getAnimations().forEach((a) => a.cancel());
    await wait(reduceMotion ? 0 : 500);
    note.style.visibility = "";
    if (reduceMotion) {
      note.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 250 });
    } else {
      note.animate(
        [{ transform: "rotate(-4deg) translateY(-50px)", opacity: 0 },
         { transform: REST + " translateY(0)", opacity: 1 }],
        { duration: 550, easing: "cubic-bezier(.2,.8,.3,1)" }
      );
    }
  }

  // Method 1: fetch. Method 2 (fallback): a hidden <form> posted into a hidden <iframe>,
  // which works in places where fetch is blocked (sandboxed previews, strict browsers).
  async function postViaFetch(text) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 20000);
    try {
      const body = new URLSearchParams();
      body.append(ENTRY_ID, text);
      body.append("fvv", "1");
      body.append("pageHistory", "0");
      await fetch(FORM_URL, { method: "POST", mode: "no-cors", body, signal: ctrl.signal });
      return true;
    } catch (e) {
      return false;
    } finally {
      clearTimeout(timer);
    }
  }

  function postViaIframe(text) {
    return new Promise((resolve) => {
      const name = "gf_" + Date.now();
      const iframe = document.createElement("iframe");
      iframe.name = name;
      iframe.style.display = "none";
      const f = document.createElement("form");
      f.method = "POST";
      f.action = FORM_URL;
      f.target = name;
      f.style.display = "none";
      const input = document.createElement("textarea");
      input.name = ENTRY_ID;
      input.value = text;
      f.appendChild(input);
      [["fvv", "1"], ["pageHistory", "0"]].forEach(([k, v]) => {
        const h = document.createElement("input");
        h.type = "hidden"; h.name = k; h.value = v;
        f.appendChild(h);
      });
      let done = false;
      const finish = (ok) => {
        if (done) return;
        done = true;
        setTimeout(() => { iframe.remove(); f.remove(); }, 500);
        resolve(ok);
      };
      iframe.addEventListener("load", () => finish(true));
      setTimeout(() => finish(false), 10000); // nothing loaded: treat as failed
      document.body.append(iframe, f);
      try { f.submit(); } catch (e) { finish(false); }
    });
  }

  async function postSuggestion(text) {
    if (await postViaFetch(text)) return true;
    return postViaIframe(text);
  }

  let busy = false;
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (busy) return;

    const text = ta.value.trim();
    if (!text) { setStatus("Write something first.", true); ta.focus(); return; }
    if ($("website").value) return; // honeypot: bots fill this in
    if (FORM_URL.includes("PASTE_") || ENTRY_ID.includes("PASTE_")) {
      setStatus("Setup needed: add your Google Form details in index.html.", true);
      return;
    }

    busy = true;
    btn.disabled = true;
    ta.readOnly = true;
    setStatus("");

    const [ok] = await Promise.all([postSuggestion(text), dropNote()]);

    if (ok) {
      ta.value = "";
      count.textContent = "0 / 1000";
      setStatus("Thanks! Your suggestion is in the box.");
      await wait(reduceMotion ? 200 : 900);
    } else {
      setStatus("Couldn't send. Check your connection and try again.", true);
    }

    await bringNoteBack();
    btn.disabled = false;
    ta.readOnly = false;
    busy = false;
    if (!ok) ta.focus();
  });
</script>
</body>
</html>
